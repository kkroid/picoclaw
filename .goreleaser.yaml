# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj
version: 2
project_name: oneappfactory

git:
  ignore_tags:
    - nightly
    - ".*-nightly.*"

before:
  hooks:
    - go mod tidy
    - sh -c 'cd web/frontend && pnpm install && pnpm build:backend'
    - go install github.com/tc-hib/go-winres@latest
    - go-winres make --in web/backend/winres/winres.json --out web/backend/rsrc --product-version={{ .Version }} --file-version={{ .Version }}

builds:
  - id: oneappfactory
    binary: oneappfactory
    env:
      - CGO_ENABLED=0
    tags:
      - goolm
      - stdjson
    ldflags:
      - -s -w
      - -X github.com/sipeed/oneappfactory/pkg/config.Version={{ .Version }}
      - -X github.com/sipeed/oneappfactory/pkg/config.GitCommit={{ .ShortCommit }}
      - -X github.com/sipeed/oneappfactory/pkg/config.BuildTime={{ .Date }}
      - -X github.com/sipeed/oneappfactory/pkg/config.GoVersion={{ .Env.GOVERSION }}
    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - netbsd
    goarch:
      - amd64
      - arm64
      - riscv64
      - loong64
      - arm
      - s390x
      - mipsle
    goarm:
      - "6"
      - "7"
    gomips:
      - softfloat
    main: ./cmd/oneappfactory
    ignore:
      - goos: windows
        goarch: arm
      - goos: netbsd
        goarch: s390x
      - goos: netbsd
        goarch: mips64
      - goos: netbsd
        goarch: arm

  - id: oneappfactory-launcher
    binary: oneappfactory-launcher
    env:
      - CGO_ENABLED=0
    tags:
      - goolm
      - stdjson
    ldflags:
      - -s -w
      - -X github.com/sipeed/oneappfactory/pkg/config.Version={{ .Version }}
      - -X github.com/sipeed/oneappfactory/pkg/config.GitCommit={{ .ShortCommit }}
      - -X github.com/sipeed/oneappfactory/pkg/config.BuildTime={{ .Date }}
      - -X github.com/sipeed/oneappfactory/pkg/config.GoVersion={{ .Env.GOVERSION }}
    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - netbsd
    goarch:
      - amd64
      - arm64
      - riscv64
      - loong64
      - arm
      - s390x
      - mipsle
    goarm:
      - "6"
      - "7"
    gomips:
      - softfloat
    main: ./cmd/oneappfactory-launcher
    ignore:
      - goos: windows
        goarch: arm
      - goos: netbsd
        goarch: s390x
      - goos: netbsd
        goarch: mips64
      - goos: netbsd
        goarch: arm

dockers_v2:
  - id: oneappfactory
    dockerfile: docker/Dockerfile.goreleaser
    ids:
      - oneappfactory
    images:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/oneappfactory"
    tags:
      - '{{ if isEnvSet "NIGHTLY_BUILD" }}nightly{{ else }}{{ .Tag }}{{ end }}'
      - '{{ if isEnvSet "NIGHTLY_BUILD" }}nightly{{ else }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/riscv64

  - id: oneappfactory-launcher
    dockerfile: docker/Dockerfile.goreleaser.launcher
    extra_files:
      - docker/entrypoint.sh
    ids:
      - oneappfactory
      - oneappfactory-launcher
    images:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/oneappfactory-launcher"
    tags:
      - '{{ if isEnvSet "NIGHTLY_BUILD" }}nightly{{ else }}{{ .Tag }}{{ end }}'
      - '{{ if isEnvSet "NIGHTLY_BUILD" }}nightly{{ else }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
      - linux/riscv64

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - oneappfactory
        - oneappfactory-launcher
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true
        timeout: 20m

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - id: oneappfactory
    ids:
      - oneappfactory
      - oneappfactory-launcher
    package_name: oneappfactory
    file_name_template: >-
      {{ .PackageName }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "arm64" }}aarch64
      {{- else if eq .Arch "arm" }}armv{{ .Arm }}
      {{- else }}{{ .Arch }}{{ end }}
    vendor: OneAppFactory
    homepage: https://github.com/{{ .Env.GITHUB_REPOSITORY_OWNER }}/oneappfactory
    maintainer: OneAppFactory contributors
    description: OneAppFactory app generation console and builder orchestrator
    license: MIT
    formats:
      - rpm
      - deb
    bindir: /usr/bin
    contents:
      - src: web/oneappfactory-launcher.desktop
        dst: /usr/share/applications/oneappfactory-launcher.desktop
      - src: web/oneappfactory-launcher.png
        dst: /usr/share/icons/hicolor/512x512/apps/oneappfactory-launcher.png

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  disable: '{{ isEnvSet "NIGHTLY_BUILD" }}'
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
